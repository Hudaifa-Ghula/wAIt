<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wAIt · Learn while waiting</title><link rel="stylesheet" href="learn.css"></head>
<body><div class="container"><header><div><span class="eyebrow">wAIt / A little progress, while you wait</span><h1>Learn something along the way.</h1></div><span id="status-badge" class="badge">Connecting</span></header>
<main><p id="task-label"></p><p id="source" class="muted"></p><div class="toolbar"><button id="btn-generate" class="primary-btn">Explain this task</button><button id="btn-scroll">Switch to Instagram Reels ↗</button></div>
<div class="explanation-card"><div id="explanation-text" aria-live="polite"></div><p id="model" class="muted"></p><div class="actions"><button id="btn-simpler">Simpler</button><button id="btn-deeper">Go deeper</button><button id="btn-understood">I understand</button></div><label for="question">Something unclear?</label><div class="question"><input id="question" maxlength="1000" placeholder="Ask about this concept"><button id="btn-ask">Ask</button></div></div>
<p id="error-message" role="status"></p><details><summary>Choose context to teach from</summary><p class="muted">Only share relevant code or a task description. This text is sent to Groq. Avoid credentials and unrelated files.</p><textarea id="context" rows="7" maxlength="7000" placeholder="Paste a code selection or describe the task…"></textarea><button id="btn-context">Use this context</button></details>
<details><summary>Learning history</summary><div id="history"></div><button id="btn-reset">Reset this task’s history</button></details>
<footer><span id="countdown" role="status"></span><button id="btn-return" class="primary-btn">Back to AI ↗</button></footer></main></div><script src="learn.js"></script></body></html>
